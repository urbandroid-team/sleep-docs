{{- $src := .Destination -}}
{{- if not (urls.Parse $src).Scheme -}}
  {{- if not (strings.Contains $src "/") -}}
    {{- $src = printf "/assets/images/%s" $src -}}
  {{- end -}}
  {{- $src = printf "/docs/%s" (strings.TrimPrefix "/docs/" (strings.TrimPrefix "/" $src)) -}}
{{- end -}}
<img src="{{ $src | safeURL }}" alt="{{ .Text }}" {{ with .Title }}title="{{ . }}" {{ end }}style="max-width: min(500px, 100%); height: auto; display: block; margin: 1rem auto;" />
