baseURL = '/docs/'
title = 'Sleep as Android Docs'
theme = 'hugo-book'
uglyURLs = true
publishDir = '../public/docs'

# Configure basic Hugo behavior
disablePathToLower = false
enableGitInfo = false
disableKinds = ["taxonomy", "term"]

# Disable relative URLs to ensure paths are absolute from root
relativeURLs = false
canonifyURLs = false

[markup]
[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 1

[markup.highlight]
  style = 'base16-snazzy'

[params]
  # Theme 'auto' switches between dark and light modes based on browser/os preferences
  BookTheme = 'auto'

  # Render all sections into the navigation menu
  BookSection = '/'

  # Enable the local search bar
  BookSearch = true

  # Enable right-side Table of Contents
  BookToC = true
